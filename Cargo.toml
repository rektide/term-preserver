[package]
name = "term-preserver"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bon = "3.8"
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
figment2 = { version = "0.11.5", features = ["toml"] }
nix = { version = "0.31", features = ["ioctl", "poll", "process", "signal", "term"] }
pty-process = "0.5.3"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"

[dev-dependencies]
assert_cmd = "2.0"
expectrl = "0.9"
predicates = "3.1"
serial_test = "3.2"
tempfile = "3.20"
